<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container">

<h2>Reset Password</h2>

<form id="forgotForm">

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<button type="submit">
Send Reset Link
</button>

<p id="message"></p>

</form>

<p class="login-text">

<a href="login.html">
Back to Login
</a>

</p>

</div>

<script type="module" src="js/forgot.js"></script>

</body>

</html>

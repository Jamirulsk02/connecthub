<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="container">

<h2>Welcome Back</h2>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>
<p id="message"></p>

</form>
<p class="login-text"></p>

<p>
<a href="forgot-password.html">
Forgot Password?
</a>
</p>
<p class="login-text"></p>

<p>
Don't have an account?
<a href="register.html">
Create Account
</a>
</p>

</div>

<script type="module" src="js/login.js"></script>

</body>
</html>
